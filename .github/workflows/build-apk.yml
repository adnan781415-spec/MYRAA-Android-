name: Build MYRAA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MYRAA package
        run: |
          unzip -q MYRAA-Full-Android-Package.zip -d unpacked

      - name: Build Android APK
        run: |
          cd unpacked/MYRAA-Full-Android-Package/MYRAA-Android-Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: unpacked/MYRAA-Full-Android-Package/MYRAA-Android-Project/app/build/outputs/apk/debug/app-debug.apk
